<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Vendors</title><link rel="stylesheet" href="/static/style.css"></head>
<body><nav><b>Network Command Assistant</b><span><a href="/">Search</a><a href="/compare">Compare</a></span></nav><main><h1>Compare vendor commands</h1><form><input name="q" value="{{q}}" placeholder="Try: bgp neighbor, arp, routing table"><button>Compare</button></form>
<div class="grid">{% for v in ["Cisco","FortiGate","Palo Alto"] %}<section><h2>{{v}}</h2>{% for c in grouped.get(v,[]) %}<div class="card"><small>{{c.category}}</small><h3>{{c.title}}</h3><pre>{{c.command}}</pre><a href="/command/{{c.id}}">Details →</a></div>{% else %}{% if q %}<p>No match yet.</p>{% endif %}{% endfor %}</section>{% endfor %}</div></main></body></html>
